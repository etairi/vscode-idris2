# Continuous integration for vscode-idris2, per docs/ROADMAP.md §7.2 and docs/ARCHITECTURE.md §13
# as they apply to M1:
#   ubuntu-latest   types, lint, unit, grammar, the §4 graph check, integration (xvfb), `vsce
#                   package` (the .vsix is uploaded as an artifact), and the grammar corpus test,
#                   which fetches a pinned third-party repository (needs network)
#   macos-latest    lint, unit, grammar, integration, then with Homebrew idris2: `idris2 --check`
#                   of every fixture and snippet expansion, and the e2e suite (`npm run
#                   test:e2e`, test/e2e/ against the real compiler)
#   windows-latest  lint, unit, integration (sockets, path quoting and an idris2 install route
#                   are unverified on Windows, ROADMAP E13)
# "Integration" is every suite of .vscode-test.mjs except e2e: `integration`, `simple-ipkg` and
# `toolchain-path`, all driven by the fake tools of test/fake-tools (on Windows through their
# `.cmd` launchers). No job before the macOS e2e step has a real idris2 on PATH.
# `npm test` runs `pretest` first (compile-tests, check-types, lint, esbuild bundle), so the
# integration step repeats type-checking and lint on purpose: the separate steps name the
# failing stage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. Every other run (a push to main,
# a manual run) gets a group of its own, so it is never cancelled — not even while pending, which
# a shared group with cancel-in-progress: false would still do to all but the newest pending
# run — and every commit on main keeps its own CI result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Grammar tests
        run: npm run test:grammar
      - name: ROADMAP §4 graph matches docs/milestones.yaml
        run: npm run docs:graph:check

      # @vscode/test-electron downloads the latest stable VS Code that satisfies engines.vscode
      # into .vscode-test/vscode-<platform>-<version>. The cache key is that version, so a new
      # release gets a new entry. Only the download is cached, never .vscode-test/user-data:
      # every run starts with a fresh profile.
      - name: Resolve the VS Code version to test against
        id: vscode
        shell: bash
        run: node -e "fetch('https://update.code.visualstudio.com/api/releases/stable?released=true').then(r => r.json()).then(v => console.log('version=' + v[0])).catch(() => console.log('version=unknown'))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - name: Integration tests
        # Linux runners have no display: run the Electron process under a virtual X server.
        run: xvfb-run -a npm test

      - name: Package the extension (vsce package)
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-idris2-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Grammar corpus test (fetches the pinned corpus from GitHub)
        run: npm run test:corpus

  macos:
    name: macos-latest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Grammar tests
        run: npm run test:grammar

      - name: Resolve the VS Code version to test against
        id: vscode
        shell: bash
        run: node -e "fetch('https://update.code.visualstudio.com/api/releases/stable?released=true').then(r => r.json()).then(v => console.log('version=' + v[0])).catch(() => console.log('version=unknown'))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - name: Integration tests
        run: npm test

      - name: Install Idris 2 (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install idris2
          idris2 --version
      - name: idris2 --check / --dump-ipkg-json every fixture and snippet expansion
        run: npm run check:fixtures
      # test:e2e compiles again (compile-tests, check-types, lint, bundle), then runs only the
      # `e2e` suite of .vscode-test.mjs, whose Extension Host finds this idris2 on PATH.
      - name: E2E tests (real idris2)
        run: npm run test:e2e

  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

      - name: Resolve the VS Code version to test against
        id: vscode
        shell: bash
        run: node -e "fetch('https://update.code.visualstudio.com/api/releases/stable?released=true').then(r => r.json()).then(v => console.log('version=' + v[0])).catch(() => console.log('version=unknown'))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}
      - name: Integration tests
        run: npm test
